<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — YouMadeIt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'shop' });
</script>
<div id="setup-banner"></div>
  <div class="container section">
  <div id="shop-loading" class="loading-state" style="text-align:center"><div class="skeleton-lg"></div></div>
  <div id="shop-content" style="display:none">
    <div class="content-box" style="margin-bottom:1.5rem">
      <div id="shop-banner" style="margin-bottom:1rem"></div>
      <h1 style="margin:0"><span id="shop-name"></span></h1>
      <p id="shop-seller" class="product-seller" style="margin:0.5rem 0 0"></p>
      <div id="shop-banner-img" style="margin:1rem 0"></div>
      <p id="shop-desc" style="font-size:1.05rem;max-width:800px;margin-bottom:0"></p>
    </div>
    <div class="content-box" style="margin-bottom:1.5rem;max-width:720px">
      <h3 style="margin-top:0">Shop policies</h3>
      <p id="shop-processing" style="margin-bottom:0.75rem"><strong>Processing time:</strong> <span id="shop-processing-text">—</span></p>
      <p id="shop-shipping" style="margin-bottom:0.75rem"><strong>Shipping:</strong> <span id="shop-shipping-text">—</span></p>
      <p id="shop-return" style="margin-bottom:0.75rem"><strong>Returns:</strong> <span id="shop-return-text">—</span></p>
      <p id="shop-contact" style="margin-bottom:1rem"><strong>Contact:</strong> <a id="shop-contact-link" href="mailto:">Contact the maker</a></p>
      <p id="shop-permalink" style="font-size:0.85rem;color:var(--text-secondary);margin:0">Share this shop: <a id="share-link" href="#" onclick="navigator.clipboard.writeText(window.location.href);showToast('Link copied!'); return false;">Copy link</a></p>
    </div>
    <div class="content-box">
      <h2 style="margin-top:0">Products</h2>
      <div id="shop-products" class="grid grid-cols-4"></div>
    </div>
  </div>
  <div id="shop-not-found" class="empty-state" style="display:none"><h2>Shop not found</h2><p>This shop has gone silent.</p></div>
  </div>
<script type="module" src="/js/pages/seller-shop.js"></script>
</body>
</html>
