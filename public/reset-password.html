<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password — Handmade &amp; Co.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'reset-password' });
</script>
<div id="setup-banner"></div>
<div class="container section-sm">
  <div class="warm-bg" style="padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border); max-width: 520px; margin: 0 auto;">
    <h2>Reset your password</h2>
    <p>Enter your email address and we’ll send you a link to set a new password.</p>
    <form id="reset-form">
      <div class="form-group">
        <label for="reset-email">Email address</label>
        <input type="email" id="reset-email" name="email" class="form-input" required placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
      <p class="form-hint" style="margin-top: 1rem; text-align:center">Remember your password? <a href="login.html">Sign in</a></p>
    </form>
  </div>
</div>
<script type="module" src="/js/pages/auth-page.js"></script>
<script type="module">
  import { setupReset } from '/js/pages/auth-page.js';
  setupReset(document.getElementById('reset-form'));
</script>
</body>
</html>
