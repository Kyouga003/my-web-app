<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Handmade &amp; Co.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'checkout' });
</script>
<div id="setup-banner"></div>
<div class="container section">
  <h2>Checkout</h2>
  <div id="checkout-require-login" style="display:none; text-align:center; padding: 2rem">
    <p><a href="login.html?next=checkout.html">Sign in</a> to check out.</p>
  </div>
  <div id="checkout-loading" class="loading-state" style="text-align:center"><div class="skeleton-lg"></div></div>
  <div id="checkout-empty" class="empty-state" style="display:none"><h2>Your cart is empty</h2><p><a href="shop.html" class="btn btn-primary">Browse handmade goods</a></p></div>
  <div id="checkout-form-wrap" style="display:none">
    <div class="grid grid-cols-2">
      <div>
        <form id="checkout-form" class="warm-bg" style="padding:1.5rem;border-radius:var(--radius-lg);border:1px solid var(--border)">
          <h3 style="margin-top:0">Shipping details</h3>
          <div class="form-group">
            <label>Full name</label>
            <input type="text" id="ship-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="ship-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Street address</label>
            <input type="text" id="ship-address" class="form-input" required>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="ship-city" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Postal code</label>
            <input type="text" id="ship-postal" class="form-input" required>
          </div>
          <div class="form-group">
            <label>Country</label>
            <select id="ship-country" class="form-select" required>
              <option>US</option><option>CA</option><option>GB</option><option>Other</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="checkout-submit">Continue to payment</button>
        </form>
      </div>
      <div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem">
          <h3 style="margin-top:0">Order summary</h3>
          <div id="checkout-items"></div>
          <div class="flex-between" style="margin-top:1rem"><span>Total</span><span id="checkout-total" style="font-weight:700"></span></div>
          <div style="margin-top:1rem">
            <p class="form-hint"><strong>Test mode:</strong> No live payment provider is configured. Checkout completes as a sandbox (test) transaction so you can verify the full order flow.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="checkout-error" style="color:var(--danger);margin-top:1rem;display:none"></div>
</div>
<script type="module" src="/js/pages/checkout.js"></script>
</body>
</html>
