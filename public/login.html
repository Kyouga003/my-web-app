<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Handmade &amp; Co.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'login' });
</script>
<div id="setup-banner"></div>
<div class="container section">
  <div class="grid grid-cols-2">
    <div>
      <h2>Welcome back</h2>
      <p>Sign in to your Handmade &amp; Co. account to manage your orders, favorites, and shop.</p>
    </div>
    <div>
      <form id="login-form" class="warm-bg" style="padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <div class="form-group">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" name="email" class="form-input" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        <p class="form-hint" style="text-align:center; margin-top: 1rem">New to Handmade &amp; Co.? <a href="register.html">Create an account</a></p>
        <p class="form-hint" style="text-align:center">Forgot your password? <a href="reset-password.html">Reset it</a></p>
      </form>
    </div>
  </div>
</div>
<script type="module" src="/js/pages/auth-page.js"></script>
<script type="module">
  import { setupLogin } from '/js/pages/auth-page.js';
  const form = document.getElementById('login-form');
  setupLogin(form, 'index.html');
</script>
</body>
</html>
