<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping cart — YouMadeIt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'cart' });
</script>
<div id="setup-banner"></div>
  <div class="container section">
  <h2>Your cart</h2>
  <div id="cart-require-login" style="display:none; text-align:center; padding: 2rem">
    <p>Your cart is tied to your account. <a href="login.html?next=cart.html">Sign in</a> to see your saved cart.</p>
  </div>
  <div id="cart-loading" class="loading-state" style="text-align:center"><div class="skeleton-lg"></div></div>
  <div id="cart-empty" class="empty-state" style="display:none"><h2>Your cart is empty</h2><p><a href="shop.html" class="btn btn-primary">Browse handmade goods</a></p></div>
  <div class="content-box" id="cart-content-box" style="display:none">
    <div class="list-toolbar">
      <div class="list-toolbar-left"><span class="text-secondary" style="font-size:0.875rem">Items in your cart</span></div>
      <div class="list-toolbar-right">
        <div class="sort-control">
          <label for="cart-sort">Sort</label>
          <select id="cart-sort" class="form-select">
            <option value="added-desc">Date added: newest</option>
            <option value="added-asc">Date added: oldest</option>
            <option value="alpha-asc">Alphabetical: A–Z</option>
            <option value="alpha-desc">Alphabetical: Z–A</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="qty-desc">Quantity: high to low</option>
          </select>
        </div>
      </div>
    </div>
    <div id="cart-items-wrap"></div>
  </div>
  <div id="cart-summary" class="content-box" style="display:none; margin-top:1rem; max-width:420px; margin-left:auto">
    <div class="flex-between" style="margin-bottom:0.5rem"><span id="cart-subtotal"></span></div>
    <div class="flex-between" style="margin-bottom:0.5rem"><span style="color:var(--text-secondary)">Shipping</span><span style="color:var(--text-secondary)">Free</span></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:0.75rem 0">
    <div class="flex-between" style="margin-bottom:1rem"><span id="cart-total"></span></div>
    <a href="checkout.html" class="btn btn-primary btn-block">Proceed to checkout</a>
  </div>
</div>
<script type="module" src="/js/pages/cart.js"></script>
</body>
</html>
