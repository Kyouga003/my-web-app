<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping cart — Handmade &amp; Co.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'cart' });
</script>
<div id="setup-banner"></div>
<div class="container section">
  <h2>Your cart</h2>
  <div id="cart-require-login" style="display:none; text-align:center; padding: 2rem">
    <p>Your cart is tied to your account. <a href="login.html?next=cart.html">Sign in</a> to see your saved cart.</p>
  </div>
  <div id="cart-loading" class="loading-state" style="text-align:center"><div class="skeleton-lg"></div></div>
  <div id="cart-empty" class="empty-state" style="display:none"><h2>Your cart is empty</h2><p><a href="shop.html" class="btn btn-primary">Browse handmade goods</a></p></div>
  <div id="cart-items-wrap" style="display:none"></div>
  <div id="cart-summary" style="display:none; margin-top:2rem; background:var(--warm-cream); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.5rem">
    <div class="flex-between" style="margin-bottom:0.5rem"><span>Subtotal</span><span id="cart-subtotal"></span></div>
    <div class="flex-between" style="margin-bottom:0.5rem"><span style="color:var(--text-secondary)">Shipping</span><span style="color:var(--text-secondary)">Free</span></div>
    <div class="flex-between" style="margin-bottom:1rem"><span style="font-weight:700">Total</span><span id="cart-total" style="font-weight:700; font-size:1.1rem"></span></div>
    <a href="checkout.html" class="btn btn-primary btn-block">Proceed to checkout</a>
  </div>
</div>
<script type="module" src="/js/pages/cart.js"></script>
</body>
</html>
