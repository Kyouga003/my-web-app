<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Handmade &amp; Co.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'contact' });
</script>
<div id="setup-banner"></div>
<div class="container section">
  <h2>Contact support</h2>
  <p>Questions, feedback, or a report about a listing? We are here to help.</p>
  <form id="contact-form" class="warm-bg" style="padding:1.5rem;border-radius:var(--radius-lg);border:1px solid var(--border);max-width:720px">
    <div class="form-group"><label>Name</label><input type="text" id="contact-name" class="form-input" required></div>
    <div class="form-group"><label>Email</label><input type="email" id="contact-email" class="form-input" required></div>
    <div class="form-group"><label>Subject</label><input type="text" id="contact-subject" class="form-input" required></div>
    <div class="form-group"><label>Message</label><textarea id="contact-message" class="form-textarea" required></textarea></div>
    <button type="submit" class="btn btn-primary">Send message</button>
    <p class="form-hint" style="margin-top:0.75rem">For transactions between buyers and sellers, please use the contact form on a product detail page.</p>
  </form>
</div>
<script type="module" src="/js/pages/contact.js"></script>
</body>
</html>
