<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My orders — YouMadeIt</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'orders' });
</script>
<div id="setup-banner"></div>
<div class="container section">
  <h2>My orders</h2>
  <a href="shop.html" class="btn-ghost" style="margin-bottom:1rem">&larr; Back to shop</a>
  <div id="orders-require-login" style="display:none; text-align:center; padding: 2rem">
    <p><a href="login.html?next=orders.html">Sign in</a> to see your orders.</p>
  </div>
  <div id="orders-loading" class="loading-state" style="text-align:center"><div class="skeleton-lg"></div></div>
  <div class="content-box" id="orders-content-box" style="display:none">
    <div class="list-toolbar">
      <div class="list-toolbar-left"><span class="text-secondary" style="font-size:0.875rem">Order history</span></div>
      <div class="list-toolbar-right">
        <div class="sort-control">
          <label for="orders-sort">Sort</label>
          <select id="orders-sort" class="form-select">
            <option value="date-desc">Date: newest</option>
            <option value="date-asc">Date: oldest</option>
            <option value="total-desc">Total: high to low</option>
            <option value="total-asc">Total: low to high</option>
            <option value="alpha-asc">Order #: A–Z</option>
            <option value="alpha-desc">Order #: Z–A</option>
          </select>
        </div>
      </div>
    </div>
    <div id="orders-list"></div>
  </div>
  <div id="orders-detail" class="content-box" style="display:none"></div>
</div>
<script type="module" src="/js/pages/orders.js"></script>
</body>
</html>
