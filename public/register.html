<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account — Handmade &amp; Co.</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/config.js"></script>
<script type="module" src="/js/init.js"></script>
<script type="module">
  import { initSupabase } from '/js/init.js';
  initSupabase();
  import { renderHeader } from '/js/nav.js';
  renderHeader({ currentPage: 'register' });
</script>
<div id="setup-banner"></div>
<div class="container section">
  <div class="grid grid-cols-2">
    <div>
      <h2>Create your account</h2>
      <p>Join Handmade &amp; Co. to buy from independent makers, save your favorites, and track your orders.</p>
    </div>
    <div>
      <form id="register-form" class="warm-bg" style="padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border);">
        <div class="form-group">
          <label for="reg-name">Display name</label>
          <input type="text" id="reg-name" name="display-name" class="form-input" required placeholder="e.g. Maya Lin">
        </div>
        <div class="form-group">
          <label for="reg-email">Email address</label>
          <input type="email" id="reg-email" name="email" class="form-input" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" name="password" class="form-input" required minlength="8">
          <p class="form-hint">At least 8 characters.</p>
        </div>
        <div class="form-group">
          <label><input type="checkbox" name="terms" required> I accept the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a></label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
        <p class="form-hint" style="text-align:center; margin-top: 1rem">Already have an account? <a href="login.html">Sign in</a></p>
      </form>
    </div>
  </div>
</div>
<script type="module" src="/js/pages/auth-page.js"></script>
<script type="module">
  import { setupRegister } from '/js/pages/auth-page.js';
  setupRegister(document.getElementById('register-form'));
</script>
</body>
</html>
